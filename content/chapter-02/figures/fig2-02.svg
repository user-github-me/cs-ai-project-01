<svg xmlns="http://www.w3.org/2000/svg" width="640" height="196" viewBox="0 0 640 196" font-family="Avenir, sans-serif"><rect x="0" y="0" width="100%" height="100%" rx="10" fill="#F8EFBA"/><defs><marker id="c2s" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1976C9"/></marker></defs><rect x="0" y="6" width="88" height="186" rx="10" fill="#24426B"/><text x="44" y="95" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="800">Sensors</text><text x="44" y="113" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="400">distance,</text><text x="44" y="127" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="400">beacon,</text><text x="44" y="141" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="400">bumper</text><line x1="88" y1="34" x2="106" y2="34" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><rect x="110" y="6" width="290" height="56" rx="10" fill="#356DB7"/><text x="124" y="28" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="800">Avoid obstacles <tspan font-weight="400" font-size="11.5">· highest priority</tspan></text><text x="124" y="48" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="400">object closer than 30 cm → turn away</text><line x1="88" y1="99" x2="106" y2="99" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><rect x="110" y="71" width="290" height="56" rx="10" fill="#458CC4"/><text x="124" y="93" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="800">Seek target <tspan font-weight="400" font-size="11.5">· middle priority</tspan></text><text x="124" y="113" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="400">dock signal detected → steer to dock</text><line x1="88" y1="164" x2="106" y2="164" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><rect x="110" y="136" width="290" height="56" rx="10" fill="#C2DAE5"/><text x="124" y="158" font-size="14" fill="#24426B" text-anchor="start" font-weight="800">Basic movement <tspan font-weight="400" font-size="11.5">· lowest priority</tspan></text><text x="124" y="178" font-size="12" fill="#24426B" text-anchor="start" font-weight="400">always active → drive forward</text><circle cx="456" cy="164" r="14" fill="#FFFFFF" stroke="#1976C9" stroke-width="2.5"/><text x="456" y="169" font-size="14" fill="#24426B" text-anchor="middle" font-weight="800">S</text><circle cx="520" cy="164" r="14" fill="#FFFFFF" stroke="#1976C9" stroke-width="2.5"/><text x="520" y="169" font-size="14" fill="#24426B" text-anchor="middle" font-weight="800">S</text><line x1="400" y1="164" x2="440" y2="164" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><line x1="470" y1="164" x2="504" y2="164" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><line x1="534" y1="164" x2="556" y2="164" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><polyline points="400,99 456,99 456,148" fill="none" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><polyline points="400,34 520,34 520,148" fill="none" stroke="#1976C9" stroke-width="2.5" marker-end="url(#c2s)"/><rect x="560" y="136" width="80" height="56" rx="10" fill="#24426B"/><text x="600" y="160" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="800">Wheel</text><text x="600" y="177" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="800">motors</text></svg>
