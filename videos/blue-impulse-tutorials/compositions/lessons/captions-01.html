<template><style>#root{position:relative;width:1920px;height:1080px}.cuebox{position:absolute;left:196px;top:872px;width:1528px;height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font:42px/48px Inter;color:#E6E4E5}.cuebox span{background:#212C4A;padding:2px 16px;opacity:0}</style><div id="root" data-composition-id="captions-01" data-width="1920" data-height="1080" data-duration="515.666667"><div id="caption-01-000" class="clip cuebox" data-start="0.3" data-duration="6.314667" data-track-index="0"><span>Have you ever wondered how a rover could learn a useful route<br>without someone writing every turn?</span></div><div id="caption-01-001" class="clip cuebox" data-start="6.784667" data-duration="7.829333" data-track-index="0"><span>Imagine a simulated rover choosing between two paths, trying<br>moves, and receiving points for the outcomes.</span></div><div id="caption-01-002" class="clip cuebox" data-start="14.784" data-duration="4.928" data-track-index="0"><span>The important question is how that experience changes its next<br>decision.</span></div><div id="caption-01-003" class="clip cuebox" data-start="19.882" data-duration="6.506667" data-track-index="0"><span>Keep your Blue Impulse study guide open at page twenty-five. We<br>will work directly through the book.</span></div><div id="caption-01-004" class="clip cuebox" data-start="26.558667" data-duration="6.954666" data-track-index="0"><span>By the end, you will calculate a learning update yourself and<br>explain what the result actually means.</span></div><div id="caption-01-005" class="clip cuebox" data-start="34.633333" data-duration="7.253334" data-track-index="0"><span>Today you will identify an agent, an environment, a state, an<br>action, a reward, and a policy.</span></div><div id="caption-01-006" class="clip cuebox" data-start="42.056667" data-duration="7.061333" data-track-index="0"><span>You will compare exploration with exploitation, then work<br>through the numerical example on page twenty-eight.</span></div><div id="caption-01-007" class="clip cuebox" data-start="49.288" data-duration="5.184" data-track-index="0"><span>Welcome to the tutorial on basic reinforcement learning by Blue<br>Impulse.</span></div><div id="caption-01-008" class="clip cuebox" data-start="54.642" data-duration="7.829333" data-track-index="0"><span>Have paper ready for one calculation. The tutorial PDF includes<br>the same worked steps and practice question.</span></div><div id="caption-01-009" class="clip cuebox" data-start="62.641333" data-duration="8.448" data-track-index="0"><span>Treat our rover as an illustration. We are explaining a learning<br>method, not claiming every real rover learns this way.</span></div><div id="caption-01-010" class="clip cuebox" data-start="72.233333" data-duration="5.525334" data-track-index="0"><span>Look at the diagram on page twenty-five, titled One interaction<br>at time t.</span></div><div id="caption-01-011" class="clip cuebox" data-start="77.928667" data-duration="6.656" data-track-index="0"><span>The agent selects an action. The environment changes and returns<br>the next state and a reward.</span></div><div id="caption-01-012" class="clip cuebox" data-start="84.754667" data-duration="7.701333" data-track-index="0"><span>The learning algorithm uses that experience to improve the<br>policy, which is the strategy for choosing actions.</span></div><div id="caption-01-013" class="clip cuebox" data-start="92.626" data-duration="5.397333" data-track-index="0"><span>For our grid, the state could be the current square, and an<br>action could be moving right.</span></div><div id="caption-01-014" class="clip cuebox" data-start="98.193333" data-duration="7.232" data-track-index="0"><span>The reward is a number associated with the result. It is<br>feedback, not a complete instruction manual.</span></div><div id="caption-01-015" class="clip cuebox" data-start="105.595333" data-duration="5.994667" data-track-index="0"><span>Notice the return arrow. Learning depends on connecting an<br>action to what happened after it.</span></div><div id="caption-01-016" class="clip cuebox" data-start="112.733333" data-duration="6.997334" data-track-index="0"><span>Page twenty-six separates three ideas that are easy to confuse:<br>reward, policy, and value.</span></div><div id="caption-01-017" class="clip cuebox" data-start="119.900667" data-duration="6.357333" data-track-index="0"><span>Think of a journey. The reward scores an outcome now, while the<br>policy chooses the next move.</span></div><div id="caption-01-018" class="clip cuebox" data-start="126.428" data-duration="6.186667" data-track-index="0"><span>A value estimate predicts how much return a choice may lead to,<br>including later outcomes.</span></div><div id="caption-01-019" class="clip cuebox" data-start="132.784667" data-duration="6.357333" data-track-index="0"><span>A route with a small cost now can still be worthwhile if it<br>reaches a better destination.</span></div><div id="caption-01-020" class="clip cuebox" data-start="139.312" data-duration="6.485333" data-track-index="0"><span>That is why choosing the biggest immediate reward is not always<br>the best long-term decision.</span></div><div id="caption-01-021" class="clip cuebox" data-start="145.967333" data-duration="7.509334" data-track-index="0"><span>The book also warns that poorly chosen rewards can encourage<br>shortcuts that miss the designer&#x27;s real goal.</span></div><div id="caption-01-022" class="clip cuebox" data-start="154.6" data-duration="4.394667" data-track-index="0"><span>Turn to page twenty-seven and use the book&#x27;s restaurant analogy.</span></div><div id="caption-01-023" class="clip cuebox" data-start="159.164667" data-duration="7.594666" data-track-index="0"><span>Ordering the dish you currently believe is best is exploitation.<br>Trying a different dish is exploration.</span></div><div id="caption-01-024" class="clip cuebox" data-start="166.929333" data-duration="5.504" data-track-index="0"><span>Exploration gathers information because your current estimates<br>might be wrong.</span></div><div id="caption-01-025" class="clip cuebox" data-start="172.603333" data-duration="8.341334" data-track-index="0"><span>In the book&#x27;s epsilon-greedy example, epsilon is zero point one,<br>giving a ten percent exploration probability.</span></div><div id="caption-01-026" class="clip cuebox" data-start="181.114667" data-duration="4.842666" data-track-index="0"><span>Otherwise, the agent chooses an action with the highest current<br>Q value.</span></div><div id="caption-01-027" class="clip cuebox" data-start="186.127333" data-duration="8.917334" data-track-index="0"><span>These percentages describe probabilities over choices, not a<br>promise that exactly one out of every ten choices explores.</span></div><div id="caption-01-028" class="clip cuebox" data-start="195.214667" data-duration="8.832" data-track-index="0"><span>In a real physical system, exploration also needs safety<br>constraints. A simulation is a useful place to experiment.</span></div><div id="caption-01-029" class="clip cuebox" data-start="205.166667" data-duration="5.653333" data-track-index="0"><span>Pause and think. One route has worked twice. Another route has<br>never been tried.</span></div><div id="caption-01-030" class="clip cuebox" data-start="210.99" data-duration="5.610667" data-track-index="0"><span>Does that prove the first route is better? Take a few seconds<br>before we reveal the answer.</span></div><div id="caption-01-031" class="clip cuebox" data-start="221.770667" data-duration="5.952" data-track-index="0"><span>No. The evidence is incomplete, so the familiar route is not<br>certainly the better one.</span></div><div id="caption-01-032" class="clip cuebox" data-start="227.892667" data-duration="7.872" data-track-index="0"><span>Exploration may improve the estimate, but it has a cost. The<br>design must balance information and performance.</span></div><div id="caption-01-033" class="clip cuebox" data-start="235.934667" data-duration="8.384" data-track-index="0"><span>Write one sentence explaining why exploitation uses estimated<br>future return, rather than only the next reward.</span></div><div id="caption-01-034" class="clip cuebox" data-start="245.466667" data-duration="8.554666" data-track-index="0"><span>Now open page twenty-eight, Update a Q value. Q associates a<br>state and an action with an estimated return.</span></div><div id="caption-01-035" class="clip cuebox" data-start="254.191333" data-duration="7.722667" data-track-index="0"><span>The book calls Q-learning model-free because it does not require<br>a supplied model of environment transitions.</span></div><div id="caption-01-036" class="clip cuebox" data-start="262.084" data-duration="7.253333" data-track-index="0"><span>Model-free does not mean memory-free. The estimates still live<br>in a table or another representation.</span></div><div id="caption-01-037" class="clip cuebox" data-start="269.507333" data-duration="5.461334" data-track-index="0"><span>The update combines an old estimate with a target derived from<br>new experience.</span></div><div id="caption-01-038" class="clip cuebox" data-start="275.138667" data-duration="7.808" data-track-index="0"><span>Alpha controls how far the estimate moves toward that target.<br>Gamma discounts the future-value contribution.</span></div><div id="caption-01-039" class="clip cuebox" data-start="283.116667" data-duration="5.888" data-track-index="0"><span>We will use exactly the numbers in the guide, so you can check<br>each line against the page.</span></div><div id="caption-01-040" class="clip cuebox" data-start="290.133333" data-duration="6.122667" data-track-index="0"><span>Start with an old Q value of two and a learning rate, alpha, of<br>zero point five.</span></div><div id="caption-01-041" class="clip cuebox" data-start="296.426" data-duration="5.909333" data-track-index="0"><span>The reward is one, gamma is zero point nine, and the best next Q<br>value is four.</span></div><div id="caption-01-042" class="clip cuebox" data-start="302.505333" data-duration="7.210667" data-track-index="0"><span>First calculate the target: one plus zero point nine times four.<br>The target is four point six.</span></div><div id="caption-01-043" class="clip cuebox" data-start="309.886" data-duration="6.933333" data-track-index="0"><span>Next subtract the old estimate. Four point six minus two gives<br>an error of two point six.</span></div><div id="caption-01-044" class="clip cuebox" data-start="316.989333" data-duration="5.525334" data-track-index="0"><span>Multiply that error by alpha. Half of two point six is one point<br>three.</span></div><div id="caption-01-045" class="clip cuebox" data-start="322.684667" data-duration="6.314666" data-track-index="0"><span>Finally add the change to the old value. Two plus one point<br>three gives three point three.</span></div><div id="caption-01-046" class="clip cuebox" data-start="329.169333" data-duration="7.744" data-track-index="0"><span>Watch the estimate move halfway toward the target. That halfway<br>movement is what alpha equals one half means here.</span></div><div id="caption-01-047" class="clip cuebox" data-start="337.083333" data-duration="7.68" data-track-index="0"><span>The supporting Python file repeats this calculation and prints<br>every intermediate value for you to inspect.</span></div><div id="caption-01-048" class="clip cuebox" data-start="345.9" data-duration="8.341333" data-track-index="0"><span>Return to the final paragraph on page twenty-eight. This<br>experience raised the estimate from two to three point three.</span></div><div id="caption-01-049" class="clip cuebox" data-start="354.411333" data-duration="7.061334" data-track-index="0"><span>It did not prove that the action is always best. One observation<br>is not a reliable policy.</span></div><div id="caption-01-050" class="clip cuebox" data-start="361.642667" data-duration="6.570666" data-track-index="0"><span>Repeated experience, an appropriate learning schedule, and<br>enough exploration are still important.</span></div><div id="caption-01-051" class="clip cuebox" data-start="368.383333" data-duration="6.442667" data-track-index="0"><span>There is also a special case: when the next state is terminal,<br>the future-value term is zero.</span></div><div id="caption-01-052" class="clip cuebox" data-start="374.996" data-duration="5.994667" data-track-index="0"><span>That prevents the calculation from inventing future reward after<br>the episode has ended.</span></div><div id="caption-01-053" class="clip cuebox" data-start="381.160667" data-duration="7.722666" data-track-index="0"><span>Compare these two ideas: updating an estimate from evidence, and<br>guaranteeing the outcome of the next action.</span></div><div id="caption-01-054" class="clip cuebox" data-start="389.053333" data-duration="4.8" data-track-index="0"><span>They are different claims, and only the first follows from our<br>calculation.</span></div><div id="caption-01-055" class="clip cuebox" data-start="395" data-duration="5.674667" data-track-index="0"><span>Your turn. Keep the old value at two, alpha at one half, and the<br>reward at one.</span></div><div id="caption-01-056" class="clip cuebox" data-start="400.844667" data-duration="6.336" data-track-index="0"><span>Make the next state terminal. What is the new Q value? Pause the<br>video if you need more time.</span></div><div id="caption-01-057" class="clip cuebox" data-start="413.350667" data-duration="7.530666" data-track-index="0"><span>The future contribution is zero, so the target is one. The error<br>is one minus two, or negative one.</span></div><div id="caption-01-058" class="clip cuebox" data-start="421.051333" data-duration="6.933334" data-track-index="0"><span>Half that error is negative one half. Add it to two, giving a<br>new value of one point five.</span></div><div id="caption-01-059" class="clip cuebox" data-start="428.154667" data-duration="8.128" data-track-index="0"><span>The estimate falls because the observed target is lower. A<br>learning update can decrease a value as well as increase it.</span></div><div id="caption-01-060" class="clip cuebox" data-start="437.433333" data-duration="5.077334" data-track-index="0"><span>Let&#x27;s recap using pages twenty-five through twenty-eight. The<br>agent acts,</span></div><div id="caption-01-061" class="clip cuebox" data-start="442.620667" data-duration="3.84" data-track-index="0"><span>receives feedback, and learns a policy from experience.</span></div><div id="caption-01-062" class="clip cuebox" data-start="446.630667" data-duration="6.677333" data-track-index="0"><span>Reward scores an outcome. Value estimates return. Exploration<br>improves information,</span></div><div id="caption-01-063" class="clip cuebox" data-start="453.418" data-duration="3.52" data-track-index="0"><span>while exploitation uses the best current estimates.</span></div><div id="caption-01-064" class="clip cuebox" data-start="457.108" data-duration="7.061333" data-track-index="0"><span>Our worked Q update produced three point three, and our<br>terminal-state practice produced one point five.</span></div><div id="caption-01-065" class="clip cuebox" data-start="464.339333" data-duration="8.789334" data-track-index="0"><span>Page thirty-one adds an important distinction: running an<br>already learned policy is not the same as training it online.</span></div><div id="caption-01-066" class="clip cuebox" data-start="473.298667" data-duration="4.949333" data-track-index="0"><span>A fixed sensor-response rule can control a machine without<br>learning at all.</span></div><div id="caption-01-067" class="clip cuebox" data-start="478.418" data-duration="7.957333" data-track-index="0"><span>Before moving on, explain the loop to someone else and run the<br>included calculation with one changed reward.</span></div><div id="caption-01-068" class="clip cuebox" data-start="487.5" data-duration="7.829333" data-track-index="0"><span>This tutorial was taught from the Blue Impulse study guide,<br>especially pages twenty-four to twenty-eight and thirty-one.</span></div><div id="caption-01-069" class="clip cuebox" data-start="495.499333" data-duration="3.754667" data-track-index="0"><span>The cover on screen is the original cover of your book.</span></div><div id="caption-01-070" class="clip cuebox" data-start="499.424" data-duration="9.066667" data-track-index="0"><span>Use the companion tutorial PDF, narration script, subtitles, and<br>Python demonstration to practise at your own pace.</span></div><div id="caption-01-071" class="clip cuebox" data-start="508.660667" data-duration="5.226666" data-track-index="0"><span>Blue Impulse study guide. Learn the reasoning, then test it with<br>an example.</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});tl.fromTo('#caption-01-000 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},0.3);tl.to('#caption-01-000 span',{opacity:0,duration:.00001},6.614667);tl.fromTo('#caption-01-001 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},6.784667);tl.to('#caption-01-001 span',{opacity:0,duration:.00001},14.614);tl.fromTo('#caption-01-002 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},14.784);tl.to('#caption-01-002 span',{opacity:0,duration:.00001},19.712);tl.fromTo('#caption-01-003 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},19.882);tl.to('#caption-01-003 span',{opacity:0,duration:.00001},26.388667);tl.fromTo('#caption-01-004 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},26.558667);tl.to('#caption-01-004 span',{opacity:0,duration:.00001},33.513333);tl.fromTo('#caption-01-005 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},34.633333);tl.to('#caption-01-005 span',{opacity:0,duration:.00001},41.886667);tl.fromTo('#caption-01-006 span',{
