      const DURATION = 64.3;
      const tl = gsap.timeline({ paused: true });

      // The builder injects scene-relative { start, end, text } caption chunks.
      // A prefix has an exact start. A clause inside a chunk waits for its end;
      // there is deliberately no estimate of word timings within a caption.
      function clauseTime(phrase, fallback) {
        const clean = text => String(text).toLowerCase().replace(/\s+/g, ' ').trim();
        const needle = clean(phrase);
        const caption = CAPTIONS.find(item => clean(item.text).includes(needle));
        if (!caption) return fallback;
        const at = Number(clean(caption.text).startsWith(needle) ? caption.start : caption.end);
        return Number.isFinite(at) ? at : fallback;
      }

      // Each entrance pulls down for exactly three frames before travelling up.
      // All initial states belong to the seekable timeline, including late scenes.
      function enter(selector, at) {
        tl.set(selector, { opacity: 0, y: 12 }, 0);
        tl.to(selector, { opacity: 1, y: 24, duration: 0.1, ease: 'power2.out' }, at);
        tl.to(selector, { y: 0, duration: 0.5, ease: 'power3.out' }, at + 0.1);
      }

      enter('#latency-demo-title', BEATS[0]);
      enter('#latency-demo-subtitle', BEATS[0] + 0.1);
      enter('#latency-demo-intro', BEATS[0] + 0.2);

      tl.set('#latency-demo-intro', { opacity: 0 }, BEATS[1]);
      enter('#latency-demo-equation', BEATS[1] + 0.1);
      tl.set('#latency-demo-equation', { opacity: 0 }, BEATS[2]);

      const examples = [
        { suffix: '500', cue: 2, result: 'Thirty times zero point five gives fifteen metres' },
        { suffix: '50', cue: 3, result: 'That gives one point five metres' },
        { suffix: '5', cue: 4, result: 'That gives zero point one five metres' }
      ];
      const resultTimes = examples.map(example => clauseTime(example.result, BEATS[example.cue] + 4.5));
      examples.forEach((example, i) => {
        enter('#latency-demo-case-' + example.suffix, BEATS[example.cue] + 0.1);
        if (i > 0) {
          // The next conversion may begin while the labelled completed result
          // remains visible. Replace the result only after its next answer.
          tl.set('#latency-demo-conversion-' + examples[i - 1].suffix, { opacity: 0 }, BEATS[example.cue]);
          tl.set('#latency-demo-result-' + examples[i - 1].suffix, { opacity: 0 }, resultTimes[i]);
        }
        enter('#latency-demo-result-' + example.suffix, resultTimes[i]);
      });

      // Give the last completed calculation a readable hold before comparison.
      // The comparison then keeps all three answers visible together.
      const chartAt = Math.max(BEATS[5] + 0.1, resultTimes[2] + 1.6);
      examples.forEach(example => tl.set('#latency-demo-case-' + example.suffix, { opacity: 0 }, chartAt));
      enter('#latency-demo-chart', chartAt);
      tl.set('#latency-demo-chart', { opacity: 0 }, BEATS[6]);
      enter('#latency-demo-limit', BEATS[6] + 0.1);

      // True common scale: 64 px per metre; 15, 1.5 and 0.15 m.
      // Each leading edge pulls left 12 px for three frames, then grows right.
      // That brief anticipation is a motion cue, not a negative-distance value.
      // Starts are staggered three frames; the resting lengths are never inflated.
      [{ suffix: '500', width: 960 }, { suffix: '50', width: 96 }, { suffix: '5', width: 9.6 }].forEach(({ suffix, width }, i) => {
        const bar = '#latency-demo-bar-' + suffix;
        const at = chartAt + 0.7 + i * 0.1;
        tl.set(bar, { scaleX: 0, opacity: 0 }, 0);
        tl.set(bar, { opacity: 1 }, at);
        tl.to(bar, { scaleX: -12 / width, duration: 0.1, ease: 'power2.in' }, at);
        tl.to(bar, { scaleX: 1, duration: 0.6, ease: 'power3.out' }, at + 0.1);
      });

      enter('#latency-demo-factors', BEATS[7]);
      enter('#latency-demo-factor-sensing', BEATS[7] + 0.1);
      enter('#latency-demo-factor-processing', BEATS[7] + 0.2);
      enter('#latency-demo-factor-actuation', BEATS[7] + 0.3);
      enter('#latency-demo-factor-braking', BEATS[7] + 0.4);

      // Hold the final explanation until the framework closes the scene.
      tl.set('#latency-demo-citation', { opacity: 1 }, DURATION - 0.001);
      window.__timelines['latency-demo'] = tl;
    })();
  </script>
