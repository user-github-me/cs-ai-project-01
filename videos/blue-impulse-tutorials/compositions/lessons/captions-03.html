<template><style>#root{position:relative;width:1920px;height:1080px}.cuebox{position:absolute;left:196px;top:872px;width:1528px;height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font:42px/48px Inter;color:#E6E4E5}.cuebox span{background:#212C4A;padding:2px 16px;opacity:0}</style><div id="root" data-composition-id="captions-03" data-width="1920" data-height="1080" data-duration="554.066667"><div id="caption-03-000" class="clip cuebox" data-start="0.3" data-duration="4.266667" data-track-index="0"><span>Have you ever wondered why a connection advertised as fast can</span></div><div id="caption-03-001" class="clip cuebox" data-start="4.676667" data-duration="4.096" data-track-index="0"><span>still make a video call freeze or a controller respond late?</span></div><div id="caption-03-002" class="clip cuebox" data-start="8.942667" data-duration="8.405333" data-track-index="0"><span>The advertised rate describes only part of the journey. Delay,<br>variation, loss, and shared demand also matter.</span></div><div id="caption-03-003" class="clip cuebox" data-start="17.518" data-duration="6.4" data-track-index="0"><span>Open your Blue Impulse study guide at page sixty-two, Capacity<br>is not responsiveness.</span></div><div id="caption-03-004" class="clip cuebox" data-start="24.088" data-duration="3.776" data-track-index="0"><span>We will use that page to diagnose problems instead of</span></div><div id="caption-03-005" class="clip cuebox" data-start="27.974" data-duration="4.010667" data-track-index="0"><span>treating every network problem as a need for more bandwidth.</span></div><div id="caption-03-006" class="clip cuebox" data-start="32.154667" data-duration="6.144" data-track-index="0"><span>Then we will calculate the effect of delay using the book&#x27;s<br>example on page seventy-four.</span></div><div id="caption-03-007" class="clip cuebox" data-start="39.433333" data-duration="5.354667" data-track-index="0"><span>Today you will distinguish bandwidth, throughput, latency,<br>jitter, and packet loss.</span></div><div id="caption-03-008" class="clip cuebox" data-start="44.958" data-duration="5.525333" data-track-index="0"><span>You will use a numerical example to connect delay with a<br>physical consequence.</span></div><div id="caption-03-009" class="clip cuebox" data-start="50.653333" data-duration="4.288" data-track-index="0"><span>You will choose responses such as compression, fewer round<br>trips,</span></div><div id="caption-03-010" class="clip cuebox" data-start="55.051333" data-duration="3.754667" data-track-index="0"><span>buffering, or local control for specific problems.</span></div><div id="caption-03-011" class="clip cuebox" data-start="58.976" data-duration="4.522667" data-track-index="0"><span>Welcome to the tutorial on network challenges by Blue Impulse.</span></div><div id="caption-03-012" class="clip cuebox" data-start="63.668667" data-duration="5.632" data-track-index="0"><span>Keep a calculator or paper ready. Every book example has a page<br>citation,</span></div><div id="caption-03-013" class="clip cuebox" data-start="69.410667" data-duration="3.776" data-track-index="0"><span>and the tutorial PDF includes the practice answers.</span></div><div id="caption-03-014" class="clip cuebox" data-start="74.333333" data-duration="7.466667" data-track-index="0"><span>Read the table at the top of page sixty-two. Bandwidth describes<br>how much data a link can carry per second.</span></div><div id="caption-03-015" class="clip cuebox" data-start="81.97" data-duration="6.613333" data-track-index="0"><span>Throughput is the successful transfer rate actually achieved. It<br>can be lower than the link&#x27;s capacity.</span></div><div id="caption-03-016" class="clip cuebox" data-start="88.753333" data-duration="6.4" data-track-index="0"><span>Latency is how long a transfer or response takes. Jitter is<br>variation in that delay.</span></div><div id="caption-03-017" class="clip cuebox" data-start="95.323333" data-duration="3.861334" data-track-index="0"><span>Packet loss means some packets do not arrive as expected.</span></div><div id="caption-03-018" class="clip cuebox" data-start="99.354667" data-duration="5.162666" data-track-index="0"><span>These measures answer different questions. A connection can<br>carry a lot of data</span></div><div id="caption-03-019" class="clip cuebox" data-start="104.627333" data-duration="2.666667" data-track-index="0"><span>and still take a long time to respond.</span></div><div id="caption-03-020" class="clip cuebox" data-start="107.464" data-duration="3.690667" data-track-index="0"><span>When describing an experiment, specify what you measured:</span></div><div id="caption-03-021" class="clip cuebox" data-start="111.264667" data-duration="4.48" data-track-index="0"><span>one-way delay, round-trip delay, or complete task response time.</span></div><div id="caption-03-022" class="clip cuebox" data-start="116.866667" data-duration="7.168" data-track-index="0"><span>Use the guide&#x27;s road analogy. A wider road can carry more cars<br>at once, like greater bandwidth.</span></div><div id="caption-03-023" class="clip cuebox" data-start="124.204667" data-duration="4.394666" data-track-index="0"><span>How many cars actually arrive each second is closer to<br>throughput.</span></div><div id="caption-03-024" class="clip cuebox" data-start="128.769333" data-duration="6.528" data-track-index="0"><span>How long one journey takes is closer to latency. Uneven arrival<br>times illustrate jitter,</span></div><div id="caption-03-025" class="clip cuebox" data-start="135.407333" data-duration="2.645334" data-track-index="0"><span>while missing deliveries illustrate loss.</span></div><div id="caption-03-026" class="clip cuebox" data-start="138.222667" data-duration="5.952" data-track-index="0"><span>Widening a road does not shorten the distance to the destination<br>or remove every queue.</span></div><div id="caption-03-027" class="clip cuebox" data-start="144.344667" data-duration="5.056" data-track-index="0"><span>Likewise, increasing link capacity does not erase propagation<br>time,</span></div><div id="caption-03-028" class="clip cuebox" data-start="149.510667" data-duration="4.501333" data-track-index="0"><span>server processing, or unnecessary back-and-forth exchanges.</span></div><div id="caption-03-029" class="clip cuebox" data-start="154.182" data-duration="7.210667" data-track-index="0"><span>The analogy helps separate the ideas, but measure the actual<br>network before deciding which factor dominates.</span></div><div id="caption-03-030" class="clip cuebox" data-start="162.533333" data-duration="6.250667" data-track-index="0"><span>Now connect page sixty-two with the media and contention<br>discussion on page fifty-six.</span></div><div id="caption-03-031" class="clip cuebox" data-start="168.954" data-duration="7.061333" data-track-index="0"><span>Wireless devices may share a medium, compete for transmission<br>time, and experience interference.</span></div><div id="caption-03-032" class="clip cuebox" data-start="176.185333" data-duration="7.274667" data-track-index="0"><span>Heavy demand can create queues. Retransmissions after loss can<br>use more capacity and add delay.</span></div><div id="caption-03-033" class="clip cuebox" data-start="183.63" data-duration="6.976" data-track-index="0"><span>Modern switched full-duplex Ethernet should not be described as<br>suffering the old shared-hub collision model.</span></div><div id="caption-03-034" class="clip cuebox" data-start="190.776" data-duration="6.656" data-track-index="0"><span>The useful diagnosis depends on the network technology, the<br>traffic, and the end-to-end path.</span></div><div id="caption-03-035" class="clip cuebox" data-start="197.602" data-duration="4.458667" data-track-index="0"><span>Try testing near the access point, with fewer competing<br>transfers,</span></div><div id="caption-03-036" class="clip cuebox" data-start="202.170667" data-duration="4.096" data-track-index="0"><span>and at different times before blaming one advertised number.</span></div><div id="caption-03-037" class="clip cuebox" data-start="207.4" data-duration="10.048" data-track-index="0"><span>Page fifty-nine explains TCP and IP. IP routes packets, while<br>TCP can provide an ordered, reliable byte stream.</span></div><div id="caption-03-038" class="clip cuebox" data-start="217.618" data-duration="6.272" data-track-index="0"><span>Reliability can require acknowledgements and retransmission, so<br>recovery may add delay.</span></div><div id="caption-03-039" class="clip cuebox" data-start="224.06" data-duration="3.392" data-track-index="0"><span>A transport choice does not by itself guarantee an</span></div><div id="caption-03-040" class="clip cuebox" data-start="227.562" data-duration="4.565333" data-track-index="0"><span>application deadline or protect every message from an attacker.</span></div><div id="caption-03-041" class="clip cuebox" data-start="232.297333" data-duration="2.901334" data-track-index="0"><span>Some applications prefer timely delivery</span></div><div id="caption-03-042" class="clip cuebox" data-start="235.308667" data-duration="5.952" data-track-index="0"><span>and handle missing data themselves. Others need complete,<br>correctly ordered transfer.</span></div><div id="caption-03-043" class="clip cuebox" data-start="241.430667" data-duration="6.805333" data-track-index="0"><span>Read the application&#x27;s requirements before selecting a protocol<br>or interpreting a performance measurement.</span></div><div id="caption-03-044" class="clip cuebox" data-start="248.406" data-duration="5.994667" data-track-index="0"><span>Pages sixty-three through sixty-five discuss security<br>separately. Confidentiality,</span></div><div id="caption-03-045" class="clip cuebox" data-start="254.510667" data-duration="5.034666" data-track-index="0"><span>integrity, and availability are distinct from simply having a<br>fast link.</span></div><div id="caption-03-046" class="clip cuebox" data-start="260.666667" data-duration="4.48" data-track-index="0"><span>Turn to page seventy-four. The guide uses a constant speed</span></div><div id="caption-03-047" class="clip cuebox" data-start="265.256667" data-duration="4.138666" data-track-index="0"><span>of thirty metres per second for an illustrative calculation.</span></div><div id="caption-03-048" class="clip cuebox" data-start="269.565333" data-duration="7.722667" data-track-index="0"><span>Distance travelled during delay equals speed multiplied by<br>delay. First convert milliseconds into seconds.</span></div><div id="caption-03-049" class="clip cuebox" data-start="277.458" data-duration="8.234667" data-track-index="0"><span>Five hundred milliseconds is zero point five seconds. Thirty<br>times zero point five gives fifteen metres.</span></div><div id="caption-03-050" class="clip cuebox" data-start="285.862667" data-duration="6.634666" data-track-index="0"><span>Fifty milliseconds is zero point zero five seconds. That gives<br>one point five metres.</span></div><div id="caption-03-051" class="clip cuebox" data-start="292.667333" data-duration="7.552" data-track-index="0"><span>Five milliseconds is zero point zero zero five seconds. That<br>gives zero point one five metres.</span></div><div id="caption-03-052" class="clip cuebox" data-start="300.389333" data-duration="7.082667" data-track-index="0"><span>Watch the three distances grow from the same starting point. We<br>changed delay while keeping speed fixed.</span></div><div id="caption-03-053" class="clip cuebox" data-start="307.642" data-duration="7.637333" data-track-index="0"><span>These are distances before a response begins, not complete<br>stopping distances and not safety guarantees.</span></div><div id="caption-03-054" class="clip cuebox" data-start="315.449333" data-duration="2.282667" data-track-index="0"><span>Sensing, processing, actuation,</span></div><div id="caption-03-055" class="clip cuebox" data-start="317.842" data-duration="5.973333" data-track-index="0"><span>and physical braking can contribute additional delay or distance<br>in a real system.</span></div><div id="caption-03-056" class="clip cuebox" data-start="324.966667" data-duration="8.042666" data-track-index="0"><span>Read the first paragraph on page seventy-four. A real-time<br>system must respond within a specified deadline.</span></div><div id="caption-03-057" class="clip cuebox" data-start="333.179333" data-duration="8.106667" data-track-index="0"><span>Real-time does not simply mean very fast. Correctness includes<br>whether the result arrives in time for its task.</span></div><div id="caption-03-058" class="clip cuebox" data-start="341.456" data-duration="4.288" data-track-index="0"><span>Missing a hard deadline can violate the system&#x27;s requirements.</span></div><div id="caption-03-059" class="clip cuebox" data-start="345.854" data-duration="3.562667" data-track-index="0"><span>Missing a soft deadline reduces quality of service.</span></div><div id="caption-03-060" class="clip cuebox" data-start="349.586667" data-duration="4.714666" data-track-index="0"><span>Moving a computation locally may remove some communication<br>delay,</span></div><div id="caption-03-061" class="clip cuebox" data-start="354.411333" data-duration="3.392" data-track-index="0"><span>but does not automatically guarantee a safe outcome.</span></div><div id="caption-03-062" class="clip cuebox" data-start="357.973333" data-duration="4.330667" data-track-index="0"><span>Use this distinction when evaluating a remote controller:</span></div><div id="caption-03-063" class="clip cuebox" data-start="362.414" data-duration="4.032" data-track-index="0"><span>what is its deadline, and what happens if the response is late?</span></div><div id="caption-03-064" class="clip cuebox" data-start="366.616" data-duration="6.336" data-track-index="0"><span>A good average is insufficient when the important problem is an<br>occasional deadline miss.</span></div><div id="caption-03-065" class="clip cuebox" data-start="374.1" data-duration="6.186667" data-track-index="0"><span>Return to the final paragraph on page sixty-two and match each<br>response to a problem.</span></div><div id="caption-03-066" class="clip cuebox" data-start="380.456667" data-duration="6.592" data-track-index="0"><span>When capacity is limited, compress or summarise suitable data.<br>When round trips dominate,</span></div><div id="caption-03-067" class="clip cuebox" data-start="387.158667" data-duration="2.581333" data-track-index="0"><span>reduce unnecessary exchanges.</span></div><div id="caption-03-068" class="clip cuebox" data-start="389.91" data-duration="7.424" data-track-index="0"><span>Timestamps help detect stale measurements. A playback buffer can<br>smooth jitter, but the buffer adds delay.</span></div><div id="caption-03-069" class="clip cuebox" data-start="397.504" data-duration="4.074667" data-track-index="0"><span>Reconnect logic and redundancy can improve resilience,</span></div><div id="caption-03-070" class="clip cuebox" data-start="401.688667" data-duration="5.76" data-track-index="0"><span>while designed local control reduces dependence on an<br>unavailable remote link.</span></div><div id="caption-03-071" class="clip cuebox" data-start="407.618667" data-duration="8.277333" data-track-index="0"><span>Page eighty-eight reminds us that growing a system adds load and<br>coordination challenges, not just more devices.</span></div><div id="caption-03-072" class="clip cuebox" data-start="416.066" data-duration="7.850667" data-track-index="0"><span>Every remedy has a trade-off. Diagnose, change one factor, and<br>measure again using the metric that matters.</span></div><div id="caption-03-073" class="clip cuebox" data-start="425.066667" data-duration="7.722666" data-track-index="0"><span>Your turn. At thirty metres per second, how far does an object<br>travel during a two hundred millisecond delay?</span></div><div id="caption-03-074" class="clip cuebox" data-start="432.959333" data-duration="6.464" data-track-index="0"><span>Convert the units before multiplying. Take a few seconds, or<br>pause the video to work it out.</span></div><div id="caption-03-075" class="clip cuebox" data-start="445.593333" data-duration="7.125334" data-track-index="0"><span>Two hundred milliseconds is zero point two seconds. Thirty times<br>zero point two is six metres.</span></div><div id="caption-03-076" class="clip cuebox" data-start="452.888667" data-duration="6.634666" data-track-index="0"><span>This is only distance during the delay. It does not include the<br>rest of a real stopping process.</span></div><div id="caption-03-077" class="clip cuebox" data-start="459.693333" data-duration="2.325334" data-track-index="0"><span>Now consider a separate question:</span></div><div id="caption-03-078" class="clip cuebox" data-start="462.128667" data-duration="7.296" data-track-index="0"><span>would adding a playback buffer always help a time-critical<br>controller? No, because buffering adds delay.</span></div><div id="caption-03-079" class="clip cuebox" data-start="469.594667" data-duration="5.802666" data-track-index="0"><span>The right network design depends on the task, not a single<br>universally best setting.</span></div><div id="caption-03-080" class="clip cuebox" data-start="476.533333" data-duration="6.08" data-track-index="0"><span>Let&#x27;s recap page sixty-two. Capacity is the limit, throughput is<br>achieved transfer,</span></div><div id="caption-03-081" class="clip cuebox" data-start="482.723333" data-duration="4.821334" data-track-index="0"><span>latency is delay, jitter is variation, and loss is missing data.</span></div><div id="caption-03-082" class="clip cuebox" data-start="487.714667" data-duration="4.949333" data-track-index="0"><span>Our page seventy-four demonstration gave fifteen, one point<br>five,</span></div><div id="caption-03-083" class="clip cuebox" data-start="492.774" data-duration="4.074667" data-track-index="0"><span>and zero point one five metres during three different delays.</span></div><div id="caption-03-084" class="clip cuebox" data-start="497.018667" data-duration="4.906666" data-track-index="0"><span>Those numbers illustrate timing; they are not total stopping<br>distances.</span></div><div id="caption-03-085" class="clip cuebox" data-start="502.095333" data-duration="6.954667" data-track-index="0"><span>Use the road analogy to keep the measures distinct, then replace<br>the analogy with an actual measurement.</span></div><div id="caption-03-086" class="clip cuebox" data-start="509.22" data-duration="8.448" data-track-index="0"><span>For practice, describe a slow application, name the metric you<br>would test, and justify one targeted improvement.</span></div><div id="caption-03-087" class="clip cuebox" data-start="517.838" data-duration="6.336" data-track-index="0"><span>Run the supporting delay calculator to check a second speed and<br>explain the units in your answer.</span></div><div id="caption-03-088" class="clip cuebox" data-start="525.3" data-duration="3.605333" data-track-index="0"><span>This tutorial was taught from the Blue Impulse study guide,</span></div><div id="caption-03-089" class="clip cuebox" data-start="529.015333" data-duration="5.845334" data-track-index="0"><span>especially pages fifty-six, fifty-nine, sixty-two, seventy-four,<br>and eighty-eight.</span></div><div id="caption-03-090" class="clip cuebox" data-start="535.030667" data-duration="4.864" data-track-index="0"><span>The original cover on screen credits the book we used throughout<br>the lesson.</span></div><div id="caption-03-091" class="clip cuebox" data-start="540.064667" data-duration="7.253333" data-track-index="0"><span>Keep the companion tutorial PDF, subtitles, narration, and delay<br>calculator for revision.</span></div><div id="caption-03-092" class="clip cuebox" data-start="547.488" data-dur
