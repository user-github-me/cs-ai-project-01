<template><style>#root{position:relative;width:1920px;height:1080px}.cuebox{position:absolute;left:196px;top:872px;width:1528px;height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font:42px/48px Inter;color:#E6E4E5}.cuebox span{background:#212C4A;padding:2px 16px;opacity:0}</style><div id="root" data-composition-id="captions-02" data-width="1920" data-height="1080" data-duration="544.833333"><div id="caption-02-000" class="clip cuebox" data-start="0.3" data-duration="6.506667" data-track-index="0"><span>Have you ever wondered how a prediction inside a computer<br>becomes a robot moving across a room?</span></div><div id="caption-02-001" class="clip cuebox" data-start="6.976667" data-duration="7.914666" data-track-index="0"><span>A model cannot see, remember, calculate, or turn a wheel without<br>physical components doing those jobs.</span></div><div id="caption-02-002" class="clip cuebox" data-start="15.061333" data-duration="6.656" data-track-index="0"><span>Today we will follow one observation through the hardware, all<br>the way to an action and new feedback.</span></div><div id="caption-02-003" class="clip cuebox" data-start="21.887333" data-duration="6.016" data-track-index="0"><span>Open the Blue Impulse study guide at page thirty-five, Hardware<br>gives software a body.</span></div><div id="caption-02-004" class="clip cuebox" data-start="28.073333" data-duration="7.317334" data-track-index="0"><span>Keep page forty-four nearby too. It explains why a control<br>signal and motor power are different things.</span></div><div id="caption-02-005" class="clip cuebox" data-start="36.533333" data-duration="6.229334" data-track-index="0"><span>You will trace the sensing, memory, processing, and actuation<br>path of a small robot.</span></div><div id="caption-02-006" class="clip cuebox" data-start="42.932667" data-duration="7.04" data-track-index="0"><span>You will explain why memory movement can limit a fast processor<br>and what a pipeline actually improves.</span></div><div id="caption-02-007" class="clip cuebox" data-start="50.142667" data-duration="6.997333" data-track-index="0"><span>You will also choose hardware by its job, rather than assuming<br>every AI system needs the same chip.</span></div><div id="caption-02-008" class="clip cuebox" data-start="57.31" data-duration="5.205333" data-track-index="0"><span>Welcome to the tutorial on how hardware enables AI by Blue<br>Impulse.</span></div><div id="caption-02-009" class="clip cuebox" data-start="62.685333" data-duration="7.552" data-track-index="0"><span>We are using the guide as our lesson: read the pictured<br>excerpts, then follow the demonstrations beside them.</span></div><div id="caption-02-010" class="clip cuebox" data-start="71.366667" data-duration="7.274666" data-track-index="0"><span>Page thirty-five groups hardware by the job it performs: input,<br>processing, output, and storage.</span></div><div id="caption-02-011" class="clip cuebox" data-start="78.811333" data-duration="8.128" data-track-index="0"><span>For our robot, the sensor supplies observations. Memory holds<br>inputs, model parameters, and working results.</span></div><div id="caption-02-012" class="clip cuebox" data-start="87.109333" data-duration="6.762667" data-track-index="0"><span>The processor evaluates the program or model, and an output<br>communicates the resulting decision.</span></div><div id="caption-02-013" class="clip cuebox" data-start="94.042" data-duration="5.973333" data-track-index="0"><span>If the robot needs to move, an actuator must turn that decision<br>into physical motion.</span></div><div id="caption-02-014" class="clip cuebox" data-start="100.185333" data-duration="7.488" data-track-index="0"><span>Notice that one device can have multiple roles. A touchscreen<br>both displays output and senses input.</span></div><div id="caption-02-015" class="clip cuebox" data-start="107.843333" data-duration="7.445334" data-track-index="0"><span>The diagram is a chain of responsibilities, not a claim that<br>every box must be a separate physical chip.</span></div><div id="caption-02-016" class="clip cuebox" data-start="116.433333" data-duration="5.162667" data-track-index="0"><span>Use a kitchen to remember the memory hierarchy on page<br>thirty-six.</span></div><div id="caption-02-017" class="clip cuebox" data-start="121.766" data-duration="3.52" data-track-index="0"><span>Registers are like the tiny workspace immediately in your</span></div><div id="caption-02-018" class="clip cuebox" data-start="125.396" data-duration="3.498667" data-track-index="0"><span>hands. Cache keeps useful ingredients close to the cook.</span></div><div id="caption-02-019" class="clip cuebox" data-start="129.064667" data-duration="6.762666" data-track-index="0"><span>Main memory is the larger active workbench, while persistent<br>storage is more like the pantry.</span></div><div id="caption-02-020" class="clip cuebox" data-start="135.997333" data-duration="5.973334" data-track-index="0"><span>The analogy is about access and capacity, not a literal map of<br>computer components.</span></div><div id="caption-02-021" class="clip cuebox" data-start="142.140667" data-duration="7.936" data-track-index="0"><span>A huge pantry does not help if ingredients arrive too slowly.<br>Similarly, a processor can wait for data.</span></div><div id="caption-02-022" class="clip cuebox" data-start="150.246667" data-duration="7.808" data-track-index="0"><span>Capacity asks how much fits. Memory bandwidth asks how quickly<br>data can move. These are different questions.</span></div><div id="caption-02-023" class="clip cuebox" data-start="159.2" data-duration="4.309333" data-track-index="0"><span>Look at the final paragraph on page thirty-six. Model weights,</span></div><div id="caption-02-024" class="clip cuebox" data-start="163.619333" data-duration="3.306667" data-track-index="0"><span>inputs, and intermediate results must fit somewhere.</span></div><div id="caption-02-025" class="clip cuebox" data-start="167.096" data-duration="2.453333" data-track-index="0"><span>When memory bandwidth is insufficient,</span></div><div id="caption-02-026" class="clip cuebox" data-start="169.659333" data-duration="5.354667" data-track-index="0"><span>a fast processor may spend time waiting instead of doing useful<br>arithmetic.</span></div><div id="caption-02-027" class="clip cuebox" data-start="175.184" data-duration="6.72" data-track-index="0"><span>Adding storage capacity alone does not automatically remove a<br>memory-transfer bottleneck.</span></div><div id="caption-02-028" class="clip cuebox" data-start="182.074" data-duration="3.946667" data-track-index="0"><span>The table also distinguishes cache, main RAM,</span></div><div id="caption-02-029" class="clip cuebox" data-start="186.130667" data-duration="5.205333" data-track-index="0"><span>and secondary storage. They are not interchangeable names for<br>one resource.</span></div><div id="caption-02-030" class="clip cuebox" data-start="191.506" data-duration="7.850667" data-track-index="0"><span>Both static RAM and dynamic RAM are volatile, although their<br>circuits and refresh requirements differ.</span></div><div id="caption-02-031" class="clip cuebox" data-start="199.526667" data-duration="3.328" data-track-index="0"><span>For this tutorial, focus on the system question:</span></div><div id="caption-02-032" class="clip cuebox" data-start="202.964667" data-duration="4.309333" data-track-index="0"><span>is the limiting factor how much fits, or how quickly it arrives?</span></div><div id="caption-02-033" class="clip cuebox" data-start="208.4" data-duration="4.586667" data-track-index="0"><span>Now compare the processing roles in the table on page forty-six.</span></div><div id="caption-02-034" class="clip cuebox" data-start="213.156667" data-duration="3.541333" data-track-index="0"><span>A CPU handles general control, branches,</span></div><div id="caption-02-035" class="clip cuebox" data-start="216.808" data-duration="6.314667" data-track-index="0"><span>and diverse tasks. A GPU can accelerate suitable parallel<br>arithmetic workloads.</span></div><div id="caption-02-036" class="clip cuebox" data-start="223.292667" data-duration="5.44" data-track-index="0"><span>Specialised accelerators can efficiently perform supported<br>tensor operations,</span></div><div id="caption-02-037" class="clip cuebox" data-start="228.842667" data-duration="3.072" data-track-index="0"><span>but their benefits depend on the actual workload.</span></div><div id="caption-02-038" class="clip cuebox" data-start="232.084667" data-duration="9.28" data-track-index="0"><span>Simple tabular reinforcement learning can run on an ordinary<br>CPU. AI does not always require a GPU.</span></div><div id="caption-02-039" class="clip cuebox" data-start="241.534667" data-duration="6.528" data-track-index="0"><span>Training changes model parameters. Inference uses an existing<br>model to produce an output.</span></div><div id="caption-02-040" class="clip cuebox" data-start="248.232667" data-duration="7.808" data-track-index="0"><span>A model can be trained on a large server and deployed on a<br>smaller device if the deployment requirements fit.</span></div><div id="caption-02-041" class="clip cuebox" data-start="257.166667" data-duration="7.786666" data-track-index="0"><span>Page thirty-nine uses laundry to explain pipelining. One load<br>can dry while a later load is washing.</span></div><div id="caption-02-042" class="clip cuebox" data-start="265.123333" data-duration="5.653334" data-track-index="0"><span>In our simplified processor, the stages are fetch, decode,<br>execute, and write.</span></div><div id="caption-02-043" class="clip cuebox" data-start="270.946667" data-duration="7.786666" data-track-index="0"><span>Instruction one enters fetch in cycle one. In cycle two, it<br>decodes while instruction two enters fetch.</span></div><div id="caption-02-044" class="clip cuebox" data-start="278.903333" data-duration="4.458667" data-track-index="0"><span>Keep stepping forward. The instructions occupy different stages,</span></div><div id="caption-02-045" class="clip cuebox" data-start="283.472" data-duration="3.882667" data-track-index="0"><span>so several instructions make progress during the same cycle.</span></div><div id="caption-02-046" class="clip cuebox" data-start="287.524667" data-duration="7.744" data-track-index="0"><span>After the pipeline fills, this ideal example completes one<br>instruction per cycle, assuming no stalls.</span></div><div id="caption-02-047" class="clip cuebox" data-start="295.438667" data-duration="6.954666" data-track-index="0"><span>It does not make an individual four-stage instruction take just<br>one cycle from start to finish.</span></div><div id="caption-02-048" class="clip cuebox" data-start="302.563333" data-duration="4.736" data-track-index="0"><span>Real pipelines can pause for dependencies, uncertain branches,</span></div><div id="caption-02-049" class="clip cuebox" data-start="307.409333" data-duration="4.053334" data-track-index="0"><span>or shared resources. The guide names these as hazards.</span></div><div id="caption-02-050" class="clip cuebox" data-start="311.632667" data-duration="7.509333" data-track-index="0"><span>Use the included Python table to compare completion cycles<br>rather than relying only on the moving picture.</span></div><div id="caption-02-051" class="clip cuebox" data-start="320.266667" data-duration="4.672" data-track-index="0"><span>Turn to page forty-four and trace the environmental control<br>loop.</span></div><div id="caption-02-052" class="clip cuebox" data-start="325.108667" data-duration="8.256" data-track-index="0"><span>An analogue sensor may need an analogue-to-digital converter.<br>Many sensors already provide digital measurements.</span></div><div id="caption-02-053" class="clip cuebox" data-start="333.534667" data-duration="7.061333" data-track-index="0"><span>The processor evaluates a decision, then a driver or power stage<br>supplies what the actuator needs.</span></div><div id="caption-02-054" class="clip cuebox" data-start="340.766" data-duration="5.248" data-track-index="0"><span>Some actuators use a digital interface or pulse-width<br>modulation.</span></div><div id="caption-02-055" class="clip cuebox" data-start="346.124" data-duration="3.882667" data-track-index="0"><span>They do not all require a digital-to-analogue converter.</span></div><div id="caption-02-056" class="clip cuebox" data-start="350.176667" data-duration="8.192" data-track-index="0"><span>Pulse-width modulation is timed switching, not the same thing as<br>converting a value into an analogue voltage.</span></div><div id="caption-02-057" class="clip cuebox" data-start="358.538667" data-duration="6.698666" data-track-index="0"><span>A control signal can tell a motor what to do without being able<br>to supply the current that moves it.</span></div><div id="caption-02-058" class="clip cuebox" data-start="366.366667" data-duration="7.146666" data-track-index="0"><span>Imagine the robot detects an obstacle, selects a turn, and sends<br>a command to its motor driver.</span></div><div id="caption-02-059" class="clip cuebox" data-start="373.683333" data-duration="6.442667" data-track-index="0"><span>The driver powers the motor, the wheels move, and the sensor<br>measures the changed situation.</span></div><div id="caption-02-060" class="clip cuebox" data-start="380.296" data-duration="6.890667" data-track-index="0"><span>That final measurement closes the feedback loop. The command<br>alone does not prove the movement succeeded.</span></div><div id="caption-02-061" class="clip cuebox" data-start="387.356667" data-duration="6.485333" data-track-index="0"><span>A wheel might slip, a sensor might be noisy, or the actuator<br>might reach a mechanical limit.</span></div><div id="caption-02-062" class="clip cuebox" data-start="394.012" data-duration="5.674667" data-track-index="0"><span>The book also separates monitoring from control. Displaying a<br>measurement monitors;</span></div><div id="caption-02-063" class="clip cuebox" data-start="399.796667" data-duration="2.773333" data-track-index="0"><span>changing the environment adds control.</span></div><div id="caption-02-064" class="clip cuebox" data-start="402.74" data-duration="6.933333" data-track-index="0"><span>This loop can use a fixed rule or a learned policy. The hardware<br>path alone does not tell you which.</span></div><div id="caption-02-065" class="clip cuebox" data-start="410.8" data-duration="5.312" data-track-index="0"><span>Pause and diagnose a system. Its processor repeatedly waits for<br>data,</span></div><div id="caption-02-066" class="clip cuebox" data-start="416.222" data-duration="3.221333" data-track-index="0"><span>and its motor driver cannot supply enough current.</span></div><div id="caption-02-067" class="clip cuebox" data-start="419.613333" data-duration="7.445334" data-track-index="0"><span>Would replacing the processor with a faster GPU solve both<br>problems? Think before the answer appears.</span></div><div id="caption-02-068" class="clip cuebox" data-start="433.228667" data-duration="8" data-track-index="0"><span>No. Memory movement and actuator power are separate limits that<br>a new GPU does not automatically remove.</span></div><div id="caption-02-069" class="clip cuebox" data-start="441.398667" data-duration="6.144" data-track-index="0"><span>Measure the path, identify the limiting stage, and match the<br>intervention to that evidence.</span></div><div id="caption-02-070" class="clip cuebox" data-start="447.712667" data-duration="6.208" data-track-index="0"><span>Page eighty-six broadens the discussion to power, heat, memory,<br>and physical constraints.</span></div><div id="caption-02-071" class="clip cuebox" data-start="454.090667" data-duration="4.821333" data-track-index="0"><span>An advertised arithmetic rate describes one capability. It is</span></div><div id="caption-02-072" class="clip cuebox" data-start="459.022" data-duration="4.117333" data-track-index="0"><span>not a complete measurement of the robot&#x27;s useful performance.</span></div><div id="caption-02-073" class="clip cuebox" data-start="464.266667" data-duration="4.394666" data-track-index="0"><span>Recap the path from page thirty-five: observations enter,</span></div><div id="caption-02-074" class="clip cuebox" data-start="468.771333" data-duration="6.464" data-track-index="0"><span>memory holds information, processing evaluates it, and outputs<br>communicate or act.</span></div><div id="caption-02-075" class="clip cuebox" data-start="475.405333" data-duration="3.285334" data-track-index="0"><span>Page thirty-six explains why memory capacity</span></div><div id="caption-02-076" class="clip cuebox" data-start="478.800667" data-duration="6.698666" data-track-index="0"><span>and bandwidth both matter. Page thirty-nine separates pipeline<br>throughput from instruction latency.</span></div><div id="caption-02-077" class="clip cuebox" data-start="485.669333" data-duration="4.053334" data-track-index="0"><span>Page forty-four explains conversion, control signals,</span></div><div id="caption-02-078" class="clip cuebox" data-start="489.832667" data-duration="4.693333" data-track-index="0"><span>and actuator power. Page forty-six compares processing<br>strengths.</span></div><div id="caption-02-079" class="clip cuebox" data-start="494.696" data-duration="5.184" data-track-index="0"><span>Choose hardware by the workload, deadlines, power budget, and<br>physical task.</span></div><div id="caption-02-080" class="clip cuebox" data-start="500.05" data-duration="4.437333" data-track-index="0"><span>To check your understanding, draw a robot&#x27;s path from camera to<br>wheel,</span></div><div id="caption-02-081" class="clip cuebox" data-start="504.597333" data-duration="3.434667" data-track-index="0"><span>and label one possible bottleneck at each stage.</span></div><div id="caption-02-082" class="clip cuebox" data-start="508.202" data-duration="5.973333" data-track-index="0"><span>Then explain why a more powerful chip does not, by itself,<br>create a learning algorithm.</span></div><div id="caption-02-083" class="clip cuebox" data-start="515.3" data-duration="4.906667" data-track-index="0"><span>This tutorial used the Blue Impulse study guide, pages<br>thirty-five,</span></div><div id="caption-02-084" class="clip cuebox" data-start="520.316667" data-duration="4.48" data-track-index="0"><span>thirty-six, thirty-nine, forty-four, forty-six, and eighty-six.</span></div><div id="caption-02-085" class="clip cuebox" data-start="524.966667" data-duration="3.733333" data-track-index="0"><span>The original book cover is shown on screen as our credit.</span></div><div id="caption-02-086" class="clip cuebox" data-start="528.87" data-duration="2.304" data-track-index="0"><span>The companion tutorial PDF</span></div><div id="caption-02-087" class="clip cuebox" data-start="531.284" data-duration="6.4" data-track-index="0"><span>and pipeline demonstration help you repeat the lesson without<br>replaying every explanation.</span></div><div id="caption-02-088" class="clip cuebox" data-start="537.854" data-duration="5.184" data-track-index="0"><span>Blue Impulse study guide. Trace the whole system before choosing<br>the hardware.</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});tl.fromTo('#caption-02-000 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},0.3);tl.to('#caption-02-000 span',{opacity:0,duration:.00001},6.806667);tl.fromTo('#caption-02-001 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},6.976667);tl.to('#caption-02-001 span',{opacity:0,duration:.00001},14.891333);tl.fromTo('#caption-02-002 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},15.061333);tl.to('#caption-02-002 span',{opacity:0,duration:.00001},21.717333);tl.fromTo('#c
