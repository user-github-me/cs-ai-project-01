<template><style>#root{position:relative;width:1920px;height:1080px}.cuebox{position:absolute;left:196px;top:872px;width:1528px;height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font:42px/48px Inter;color:#E6E4E5}.cuebox span{background:#212C4A;padding:2px 16px;opacity:0}</style><div id="root" data-composition-id="captions-05" data-width="1920" data-height="1080" data-duration="572.4"><div id="caption-05-000" class="clip cuebox" data-start="0.3" data-duration="4.864" data-track-index="0"><span>Have you ever wondered what changes inside a computer after you<br>press Run?</span></div><div id="caption-05-001" class="clip cuebox" data-start="5.334" data-duration="7.893333" data-track-index="0"><span>A program does not execute because the processor understands the<br>whole page like a person reading an essay.</span></div><div id="caption-05-002" class="clip cuebox" data-start="13.397333" data-duration="7.68" data-track-index="0"><span>It follows encoded instructions, changing registers, memory, and<br>the next instruction address as it works.</span></div><div id="caption-05-003" class="clip cuebox" data-start="21.247333" data-duration="5.717334" data-track-index="0"><span>Open the Blue Impulse study guide at page thirteen, Fetch,<br>decode, execute.</span></div><div id="caption-05-004" class="clip cuebox" data-start="27.134667" data-duration="7.893333" data-track-index="0"><span>We will use that page and the tiny program on page fifteen to<br>track every important state change by hand.</span></div><div id="caption-05-005" class="clip cuebox" data-start="36.166667" data-duration="6.890666" data-track-index="0"><span>You will explain fetch, decode, and execute, and give each<br>teaching-model register a clear job.</span></div><div id="caption-05-006" class="clip cuebox" data-start="43.227333" data-duration="5.802667" data-track-index="0"><span>You will trace four instructions and distinguish an immediate<br>value from a memory address.</span></div><div id="caption-05-007" class="clip cuebox" data-start="49.2" data-duration="3.029333" data-track-index="0"><span>You will also connect source code, translators,</span></div><div id="caption-05-008" class="clip cuebox" data-start="52.339333" data-duration="6.378667" data-track-index="0"><span>and machine instructions without oversimplifying how modern<br>language implementations work.</span></div><div id="caption-05-009" class="clip cuebox" data-start="58.888" data-duration="4.714667" data-track-index="0"><span>Welcome to the tutorial on program execution by Blue Impulse.</span></div><div id="caption-05-010" class="clip cuebox" data-start="63.772667" data-duration="3.989333" data-track-index="0"><span>Have a small table ready with columns for the program counter,</span></div><div id="caption-05-011" class="clip cuebox" data-start="67.872" data-duration="4.757333" data-track-index="0"><span>current instruction, accumulator, and memory location two<br>hundred.</span></div><div id="caption-05-012" class="clip cuebox" data-start="73.766667" data-duration="1.749333" data-track-index="0"><span>Start with page fourteen,</span></div><div id="caption-05-013" class="clip cuebox" data-start="75.626" data-duration="6.890667" data-track-index="0"><span>From source code to execution. Machine code contains the<br>instructions the processor executes.</span></div><div id="caption-05-014" class="clip cuebox" data-start="82.686667" data-duration="2.816" data-track-index="0"><span>An assembler translates assembly mnemonics</span></div><div id="caption-05-015" class="clip cuebox" data-start="85.612667" data-duration="6.72" data-track-index="0"><span>and labels. A compiler produces another representation, often<br>native code or bytecode.</span></div><div id="caption-05-016" class="clip cuebox" data-start="92.502667" data-duration="5.696" data-track-index="0"><span>An interpreter runs operations through a runtime, sometimes<br>working with bytecode.</span></div><div id="caption-05-017" class="clip cuebox" data-start="98.368667" data-duration="4.608" data-track-index="0"><span>The same language can have compiled and interpreted<br>implementations,</span></div><div id="caption-05-018" class="clip cuebox" data-start="103.086667" data-duration="3.328" data-track-index="0"><span>and modern systems may combine several techniques.</span></div><div id="caption-05-019" class="clip cuebox" data-start="106.584667" data-duration="6.357333" data-track-index="0"><span>Avoid the blanket claim that every interpreter translates<br>exactly one source line at a time.</span></div><div id="caption-05-020" class="clip cuebox" data-start="113.112" data-duration="4.842667" data-track-index="0"><span>For our demonstration, the book supplies an invented assembly<br>notation</span></div><div id="caption-05-021" class="clip cuebox" data-start="118.064667" data-duration="3.008" data-track-index="0"><span>so that the state changes remain easy to see.</span></div><div id="caption-05-022" class="clip cuebox" data-start="122.2" data-duration="8.533333" data-track-index="0"><span>Page thirteen uses a recipe to explain the register jobs. The<br>program counter marks the next recipe line.</span></div><div id="caption-05-023" class="clip cuebox" data-start="130.903333" data-duration="7.893334" data-track-index="0"><span>The memory address register selects the location. The memory<br>data register carries the item read from memory.</span></div><div id="caption-05-024" class="clip cuebox" data-start="138.966667" data-duration="3.968" data-track-index="0"><span>The current instruction register holds the instruction being</span></div><div id="caption-05-025" class="clip cuebox" data-start="143.044667" data-duration="4.736" data-track-index="0"><span>followed. The accumulator is a temporary mixing bowl for<br>arithmetic.</span></div><div id="caption-05-026" class="clip cuebox" data-start="147.950667" data-duration="6.592" data-track-index="0"><span>We abbreviate those names as P C, M A R, M D R, C I R, and A C<br>C.</span></div><div id="caption-05-027" class="clip cuebox" data-start="154.712667" data-duration="7.957333" data-track-index="0"><span>The analogy helps you remember the jobs, but these are<br>electronic storage locations inside a processor model.</span></div><div id="caption-05-028" class="clip cuebox" data-start="162.84" data-duration="4.117333" data-track-index="0"><span>Keep the jobs distinct: an address points to a location,</span></div><div id="caption-05-029" class="clip cuebox" data-start="167.067333" data-duration="4.032" data-track-index="0"><span>while an instruction or value is the content being handled.</span></div><div id="caption-05-030" class="clip cuebox" data-start="172.233333" data-duration="4.181334" data-track-index="0"><span>Follow the numbered table on page thirteen. First copy the</span></div><div id="caption-05-031" class="clip cuebox" data-start="176.524667" data-duration="4.117333" data-track-index="0"><span>address in the program counter to the memory address register.</span></div><div id="caption-05-032" class="clip cuebox" data-start="180.812" data-duration="5.269333" data-track-index="0"><span>Read the instruction at that memory location into the memory<br>data register.</span></div><div id="caption-05-033" class="clip cuebox" data-start="186.251333" data-duration="5.12" data-track-index="0"><span>Advance the program counter so it identifies the next<br>instruction address,</span></div><div id="caption-05-034" class="clip cuebox" data-start="191.481333" data-duration="4.650667" data-track-index="0"><span>then copy the fetched instruction into the current instruction<br>register.</span></div><div id="caption-05-035" class="clip cuebox" data-start="196.302" data-duration="7.808" data-track-index="0"><span>The control unit can now decode the operation and its operand,<br>and the processor executes the required work.</span></div><div id="caption-05-036" class="clip cuebox" data-start="204.28" data-duration="7.637333" data-track-index="0"><span>In this simplified model, every instruction occupies one word,<br>so the program counter advances by one.</span></div><div id="caption-05-037" class="clip cuebox" data-start="212.087333" data-duration="7.424" data-track-index="0"><span>Real instruction sizes and exact timing depend on the<br>architecture. Our table is a teaching model,</span></div><div id="caption-05-038" class="clip cuebox" data-start="219.621333" data-duration="2.837334" data-track-index="0"><span>not every processor&#x27;s wiring diagram.</span></div><div id="caption-05-039" class="clip cuebox" data-start="223.6" data-duration="5.76" data-track-index="0"><span>Turn to page fifteen. The program starts at address one hundred<br>with LOAD, hash three.</span></div><div id="caption-05-040" class="clip cuebox" data-start="229.53" data-duration="4.949333" data-track-index="0"><span>The hash sign denotes an immediate value in this invented<br>notation,</span></div><div id="caption-05-041" class="clip cuebox" data-start="234.589333" data-duration="3.861334" data-track-index="0"><span>so that instruction puts the number three into the accumulator.</span></div><div id="caption-05-042" class="clip cuebox" data-start="238.620667" data-duration="7.765333" data-track-index="0"><span>Address one hundred and one contains ADD, hash four. Address one<br>hundred and two contains STORE, two hundred.</span></div><div id="caption-05-043" class="clip cuebox" data-start="246.556" data-duration="5.098667" data-track-index="0"><span>Address one hundred and three contains HALT, which ends this<br>teaching program.</span></div><div id="caption-05-044" class="clip cuebox" data-start="251.824667" data-duration="8.128" data-track-index="0"><span>The number two hundred in STORE identifies a memory location. It<br>is not the value to put into the accumulator.</span></div><div id="caption-05-045" class="clip cuebox" data-start="260.122667" data-duration="6.293333" data-track-index="0"><span>Before running anything, predict what that memory location will<br>contain when the program finishes.</span></div><div id="caption-05-046" class="clip cuebox" data-start="267.566667" data-duration="6.186666" data-track-index="0"><span>Let&#x27;s single-step. Initially, the program counter is one<br>hundred. Fetch the LOAD instruction</span></div><div id="caption-05-047" class="clip cuebox" data-start="273.863333" data-duration="2.24" data-track-index="0"><span>and advance to one hundred and one.</span></div><div id="caption-05-048" class="clip cuebox" data-start="276.273333" data-duration="5.44" data-track-index="0"><span>Decode and execute LOAD, hash three. The accumulator now<br>contains three.</span></div><div id="caption-05-049" class="clip cuebox" data-start="281.883333" data-duration="7.893334" data-track-index="0"><span>Next fetch ADD, hash four from address one hundred and one. The<br>program counter advances to one hundred and two.</span></div><div id="caption-05-050" class="clip cuebox" data-start="289.946667" data-duration="3.285333" data-track-index="0"><span>Execution adds four to the accumulator&#x27;s three,</span></div><div id="caption-05-051" class="clip cuebox" data-start="293.342" data-duration="4.544" data-track-index="0"><span>giving seven. Memory location two hundred has not been written<br>yet.</span></div><div id="caption-05-052" class="clip cuebox" data-start="298.056" data-duration="4.8" data-track-index="0"><span>Fetch STORE, two hundred. The program counter advances to one<br>hundred</span></div><div id="caption-05-053" class="clip cuebox" data-start="302.966" data-duration="5.098667" data-track-index="0"><span>and three, and execution copies seven into memory location two<br>hundred.</span></div><div id="caption-05-054" class="clip cuebox" data-start="308.234667" data-duration="8" data-track-index="0"><span>The accumulator still contains seven. STORE copies the value; it<br>does not turn the accumulator into an address.</span></div><div id="caption-05-055" class="clip cuebox" data-start="316.404667" data-duration="3.349333" data-track-index="0"><span>Finally fetch HALT. In this simplified trace,</span></div><div id="caption-05-056" class="clip cuebox" data-start="319.864" data-duration="5.354667" data-track-index="0"><span>the fetch advances the counter to one hundred and four before<br>execution stops.</span></div><div id="caption-05-057" class="clip cuebox" data-start="325.388667" data-duration="3.328" data-track-index="0"><span>Our runnable Python model prints these same states</span></div><div id="caption-05-058" class="clip cuebox" data-start="328.826667" data-duration="4.885333" data-track-index="0"><span>and the register transfers, so you can check the trace against<br>page fifteen.</span></div><div id="caption-05-059" class="clip cuebox" data-start="334.833333" data-duration="3.904" data-track-index="0"><span>Pause and check your prediction. After the STORE instruction,</span></div><div id="caption-05-060" class="clip cuebox" data-start="338.847333" data-duration="3.84" data-track-index="0"><span>what are the accumulator and memory location two hundred?</span></div><div id="caption-05-061" class="clip cuebox" data-start="342.857333" data-duration="5.376" data-track-index="0"><span>Also ask yourself whether STORE, two hundred means storing the<br>number two hundred.</span></div><div id="caption-05-062" class="clip cuebox" data-start="353.403333" data-duration="2.005334" data-track-index="0"><span>The accumulator remains seven,</span></div><div id="caption-05-063" class="clip cuebox" data-start="355.518667" data-duration="6.293333" data-track-index="0"><span>and memory location two hundred receives seven. Two hundred is<br>the destination address.</span></div><div id="caption-05-064" class="clip cuebox" data-start="361.982" data-duration="7.722667" data-track-index="0"><span>The hash sign in our LOAD and ADD operands marks literal values.<br>The STORE operand has a different role.</span></div><div id="caption-05-065" class="clip cuebox" data-start="369.874667" data-duration="7.338666" data-track-index="0"><span>This distinction prevents a common tracing mistake: confusing<br>where data lives with the value stored there.</span></div><div id="caption-05-066" class="clip cuebox" data-start="377.383333" data-duration="3.114667" data-track-index="0"><span>Use the book&#x27;s instruction meanings before applying</span></div><div id="caption-05-067" class="clip cuebox" data-start="380.608" data-duration="3.904" data-track-index="0"><span>assumptions from a different programming language or processor.</span></div><div id="caption-05-068" class="clip cuebox" data-start="385.633333" data-duration="4.096" data-track-index="0"><span>Return to page thirteen. It notes that a branch instruction</span></div><div id="caption-05-069" class="clip cuebox" data-start="389.839333" data-duration="3.754667" data-track-index="0"><span>may replace the normal next value of the program counter.</span></div><div id="caption-05-070" class="clip cuebox" data-start="393.764" data-duration="7.530667" data-track-index="0"><span>That is how the instruction sequence can follow a decision or<br>repeat a loop instead of always moving forward.</span></div><div id="caption-05-071" class="clip cuebox" data-start="401.464667" data-duration="6.805333" data-track-index="0"><span>Our four-instruction program contains no branch, so the normal<br>next addresses stay easy to follow.</span></div><div id="caption-05-072" class="clip cuebox" data-start="408.44" data-duration="6.976" data-track-index="0"><span>Page thirty-nine adds pipelining: real processors may overlap<br>work on several instructions</span></div><div id="caption-05-073" class="clip cuebox" data-start="415.526" data-duration="3.136" data-track-index="0"><span>while preserving the required program behaviour.</span></div><div id="caption-05-074" class="clip cuebox" data-start="418.832" data-duration="6.464" data-track-index="0"><span>Overlapping the implementation does not make the logical effects<br>of a program arbitrary.</span></div><div id="caption-05-075" class="clip cuebox" data-start="425.466" data-duration="4.693333" data-track-index="0"><span>For a basic trace, first understand the defined instruction<br>effects,</span></div><div id="caption-05-076" class="clip cuebox" data-start="430.269333" data-duration="3.477334" data-track-index="0"><span>then study how a specific processor implements them.</span></div><div id="caption-05-077" class="clip cuebox" data-start="434.866667" data-duration="7.338666" data-track-index="0"><span>Your turn. Change ADD, hash four to ADD, hash nine, while<br>keeping LOAD, hash three and STORE, two hundred.</span></div><div id="caption-05-078" class="clip cuebox" data-start="442.375333" data-duration="6.506667" data-track-index="0"><span>What value should reach memory location two hundred? Work<br>through the accumulator before we reveal it.</span></div><div id="caption-05-079" class="clip cuebox" data-start="455.052" data-duration="7.402667" data-track-index="0"><span>LOAD gives three. Adding nine gives twelve. STORE copies twelve<br>into memory location two hundred.</span></div><div id="caption-05-080" class="clip cuebox" data-start="462.624667" data-duration="5.930666" data-track-index="0"><span>That is a small example of testing a prediction by changing one<br>input to the program.</span></div><div id="caption-05-081" class="clip cuebox" data-start="468.725333" data-duration="4.842667" data-track-index="0"><span>The included simulator accepts a different add value, prints the<br>trace,</span></div><div id="caption-05-082" class="clip cuebox" data-start="473.678" data-duration="4.373333" data-track-index="0"><span>and checks that the final memory result matches the arithmetic.</span></div><div id="caption-05-083" class="clip cuebox" data-start="478.221333" data-duration="7.232" data-track-index="0"><span>Try another value and explain each register&#x27;s role aloud as the<br>instruction moves through the cycle.</span></div><div id="caption-05-084" class="clip cuebox" data-start="486.6" data-duration="4.053333" data-track-index="0"><span>Recap the lesson. Source code reaches execution through</span></div><div id="caption-05-085" class="clip cuebox" data-start="490.763333" data-duration="4.416" data-track-index="0"><span>a translator or runtime appropriate to its implementation.</span></div><div id="caption-05-086" class="clip cuebox" data-start="495.349333" data-duration="5.930667" data-track-index="0"><span>The program counter identifies the next instruction. Fetch<br>brings it from memory,</span></div><div id="caption-05-087" class="clip cuebox" data-start="501.39" data-duration="4.224" data-track-index="0"><span>decode interprets it, and execute performs its operation.</span></div><div id="caption-05-088" class="clip cuebox" data-start="505.784" data-duration="6.229333" data-track-index="0"><span>The memory address register selects a location, the memory data<br>register carries data,</span></div><div id="caption-05-089" class="clip cuebox" data-start="512.123333" data-duration="3.754667" data-track-index="0"><span>and the current instruction register holds the operation.</span></div><div id="caption-05-090" class="clip cuebox" data-start="516.048" data-duration="7.104" data-track-index="0"><span>Our teaching accumulator went from three to seven, and STORE<br>copied seven to memory location two hundred.</span></div><div id="caption-05-091" class="clip cuebox" data-start="523.322" data-duration="6.826667" data-track-index="0"><span>Addresses and values have different roles. Branches can change<br>the normal next instruction address.</span></div><div id="caption-05-092" class="clip cuebox" data-start="530.318667" data-duration="2.474666" data-track-index="0"><span>Revisit pages thirteen through fifteen</span></div><div id="caption-05-093" class="clip cuebox" data-start="532.903333" data-duration="3.904" data-track-index="0"><span>and complete the trace without watching the moving highlight.</span></div><div id="caption-05-094" class="clip cuebox" data-start="536.917333" data-duration="4.096" data-track-index="0"><span>Understanding means predicting the state changes yourself.</span></div><div id="caption-05-095" class="clip cuebox" data-start="542.166667" data-duration="3.178666" data-track-index="0"><span>This tutorial used the Blue Impulse study guide,</span></div><div id="caption-05-096" class="clip cuebox" data-start="545.455333" data-duration="6.08" data-track-index="0"><span>especially pages twelve through fifteen, with the pipeline<br>connection on page thirty-nine.</span></div><div id="caption-05-097" class="clip cuebox" data-start="551.705333" data-duration="3.861334" data-track-index="0"><span>The original cover on screen credits the book we followed.</span></div><div id="caption-05-098" class="clip cuebox" data-start="555.736667" data-duration="8.810666" data-track-index="0"><span>Use the companion tutorial PDF, complete narration, subtitles,<br>and runnable instruction simulator for revision.</span></div><div id="caption-05-099" class="clip cuebox" data-start="564.717333" data-duration="5.888" data-track-index="0"><span>Blue Impulse study guide. Follow the instruction, predict the<br>state, and check the result.</span></div></div><script>(function(){const tl=gsap.timeline({paused:true});tl.fromTo('#caption-05-000 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},0.3);tl.to('#caption-05-000 span',{opacity:0,duration:.00001},5.164);tl.fromTo('#caption-05-001 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},5.334);tl.to('#caption-05-001 span',{opacity:0,duration:.00001},13.227333);tl.fromTo('#caption-05-002 span',{opacity:0},{opacity:1,duration:.00001,immediateRender:false},13.397333);tl.to('#caption-05-002 span',{opacity:0,duration:.00001},21.077333);tl.fromTo('#caption-05-003 span',{opacity:0},{opacity:1,duration:.00001,immediateRen
