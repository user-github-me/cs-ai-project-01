  <script>
    (() => {
      const compositionId = "cpu-demo";
      const BEATS = [0.3,7,14,21,28,35,42,49];
      const DURATION = 60;
      const tl = gsap.timeline({ paused: true });
      const p = "#cpu-demo-";
      const hold = { progress: 0 };
      tl.to(hold, { progress: 1, duration: DURATION, ease: "none" }, 0);

      const groups = {
        pc: ["100", "101", "102", "103", "104"],
        cir: ["empty", "load", "add", "store", "halt"],
        acc: ["empty", "3", "7"],
        memory: ["empty", "7"],
        mar: ["empty", "100", "101", "102", "103"],
        mdr: ["empty", "load", "add", "store", "halt"],
        next: ["empty", "101", "102", "103", "104"],
        fetched: ["empty", "load", "add", "store", "halt"]
      };
      const panels = ["fetch", "load", "add", "store", "halt", "verify"];
      const activeTransfers = [1,2,3,4].map(n => p + "transfer-active-" + n);

      Object.entries(groups).forEach(([group, values]) => {
        tl.set(values.map(value => p + group + "-" + value), { opacity: 0 }, 0);
        tl.set(p + group + "-" + values[0], { opacity: 1 }, 0);
      });
      tl.set(panels.map(name => p + name), { opacity: 0 }, 0);
      tl.set(activeTransfers, { opacity: 0 }, 0);
      tl.set(p + "instruction-highlight", { opacity: 0, y: 0 }, 0);
      tl.set(["load-result", "add-result", "add-note", "store-result", "store-note", "halt-result"].map(name => p + name), { opacity: 0 }, 0);

      // Value substitutions are stationary: fade out the previous value first.
      function value(group, next, time) {
        tl.to(groups[group].map(v => p + group + "-" + v), { opacity: 0, duration: .08 }, time);
        tl.to(p + group + "-" + next, { opacity: 1, duration: .12 }, time + .08);
      }

      function panel(name, time) {
        tl.to(panels.map(v => p + v), { opacity: 0, duration: .12 }, time);
        tl.to(p + name, { opacity: 1, duration: .15 }, time + .12);
      }

      function transfer(step, time) {
        tl.to(activeTransfers, { opacity: 0, duration: .08 }, time);
        tl.to(p + "transfer-active-" + step, { opacity: 1, duration: .12 }, time + .08);
      }

      // The selected instruction moves down only after a three-frame pullback.
      function selectInstruction(row, time) {
        const from = row === 0 ? 0 : (row - 1) * 54;
        tl.to(p + "instruction-highlight", { opacity: 1, y: from - 12, duration: .1, ease: "power1.in" }, time);
        tl.to(p + "instruction-highlight", { y: row * 54, duration: .5, ease: "power3.out" }, time + .1);
      }

      // Explicit address/data transfers keep MAR distinct from the instruction word.
      function fetch(row, instruction, start, end) {
        const span = end - start;
        const address = String(100 + row);
        const next = String(101 + row);
        panel("fetch", start);
        selectInstruction(row, start + .1);
        transfer(1, start + span * .12);
        value("mar", address, start + span * .12);
        transfer(2, start + span * .35);
        value("mdr", instruction, start + span * .35);
        transfer(3, start + span * .58);
        value("pc", next, start + span * .58);
        value("next", next, start + span * .58);
        transfer(4, start + span * .81);
        value("cir", instruction, start + span * .81);
        value("fetched", instruction, start + span * .81);
      }

      function reveal(name, time) {
        // Content near the bottom enters downward so its pullback stays in bounds.
        tl.set(p + name, { y: -18 }, 0);
        tl.to(p + name, { opacity: 1, y: -30, duration: .1, ease: "power1.in" }, time);
        tl.to(p + name, { y: 0, duration: .5, ease: "power3.out" }, time + .1);
      }

      const span0 = BEATS[1] - BEATS[0];
      const span1 = BEATS[2] - BEATS[1];
      const span2 = BEATS[3] - BEATS[2];
      const span3 = BEATS[4] - BEATS[3];
      const span4 = BEATS[5] - BEATS[4];
      const span5 = BEATS[6] - BEATS[5];
      const span6 = BEATS[7] - BEATS[6];

      // Cue 0: PC 100, then fetch LOAD and advance the PC to 101.
      fetch(0, "load", BEATS[0] + span0 * .35, BEATS[0] + span0 * .94);

      // Cue 1: LOAD changes ACC, with memory[200] still unwritten.
      panel("load", BEATS[1] + .1);
      value("acc", "3", BEATS[1] + span1 * .55);
      reveal("load-result", BEATS[1] + span1 * .55 + .1);

      // Cue 2: fetch ADD from 101; PC becomes 102 before execution.
      fetch(1, "add", BEATS[2] + span2 * .08, BEATS[2] + span2 * .94);

      // Cue 3: ADD changes only ACC from 3 to 7.
      panel("add", BEATS[3] + .1);
      value("acc", "7", BEATS[3] + span3 * .5);
      reveal("add-result", BEATS[3] + span3 * .5 + .1);
      reveal("add-note", BEATS[3] + span3 * .72);

      // Cue 4: fetch STORE, advance PC to 103, then copy ACC into memory[200].
      fetch(2, "store", BEATS[4] + span4 * .03, BEATS[4] + span4 * .59);
      panel("store", BEATS[4] + span4 * .63);
      value("memory", "7", BEATS[4] + span4 * .84);
      reveal("store-result", BEATS[4] + span4 * .84 + .1);

      // Cue 5 deliberately leaves ACC unchanged at 7.
      reveal("store-note", BEATS[5] + span5 * .18);

      // Cue 6: the final fetch advances PC to 104; then HALT stops execution.
      fetch(3, "halt", BEATS[6] + span6 * .06, BEATS[6] + span6 * .73);
      panel("halt", BEATS[6] + span6 * .77);
      reveal("halt-result", BEATS[6] + span6 * .84);

      // Cue 7 retains the final state while directing the viewer to the model.
      panel("verify", BEATS[7] + .1);

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;
    })();
  </script>
