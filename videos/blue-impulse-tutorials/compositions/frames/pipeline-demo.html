  <script>
    (() => {
      const compositionId = "pipeline-demo";
      const BEATS = [0.3,7,14,21,28,35,42,49];
      const DURATION = 60;
      const tl = gsap.timeline({ paused: true });
      const prefix = "#pipeline-demo-";
      const anticipation = 0.1;
      const travel = 0.5;
      const step = 392;
      const hold = { progress: 0 };
      tl.to(hold, { progress: 1, duration: DURATION, ease: "none" }, 0);

      // Each entry starts with a three-frame move opposite its main travel.
      function enter(name, time) {
        const target = prefix + name;
        const direction = ["hazard-note", "table-note"].includes(name) ? -1 : 1;
        tl.set(target, { opacity: 0, y: 18 * direction }, 0);
        tl.to(target, { opacity: 1, y: 30 * direction, duration: anticipation, ease: "power1.in" }, time);
        tl.to(target, { y: 0, duration: travel, ease: "power3.out" }, time + anticipation);
      }

      const clocks = ["ready", "1", "2", "3", "4", "5", "6"].map(n => prefix + "clock-" + n);
      tl.set(clocks, { opacity: 0 }, 0);
      tl.set(prefix + "clock-ready", { opacity: 1 }, 0);

      function cycle(number, time) {
        tl.to(clocks, { opacity: 0, duration: .1 }, time);
        tl.to(prefix + "clock-" + number, { opacity: 1, duration: .12 }, time + .1);
      }

      function moveInstruction(number, fromStage, toStage, time) {
        const target = prefix + "i" + number;
        const fromX = fromStage < 0 ? -60 : fromStage * step;
        const toX = toStage * step;
        tl.to(target, { opacity: 1, x: fromX - 12, duration: anticipation, ease: "power1.in" }, time);
        tl.to(target, { x: toX, duration: travel, ease: "power3.out" }, time + anticipation);
      }

      // All states are declared up front so a direct seek is deterministic.
      tl.set([prefix + "pipeline", prefix + "hazards", prefix + "table"], { opacity: 0 }, 0);
      tl.set([prefix + "i1", prefix + "i2", prefix + "i3"], { opacity: 0, x: -60 }, 0);
      tl.set([prefix + "lesson-throughput", prefix + "lesson-latency"], { opacity: 0 }, 0);

      enter("intro-heading", BEATS[0]);
      enter("laundry-a", BEATS[0] + .1);
      enter("laundry-b", BEATS[0] + .2);
      enter("intro-note", BEATS[0] + .3);

      tl.to(prefix + "intro", { opacity: 0, duration: .2 }, BEATS[1]);
      tl.set(prefix + "pipeline", { opacity: 1 }, BEATS[1] + .2);
      ["fetch", "decode", "execute", "write"].forEach((name, i) => enter(name, BEATS[1] + .2 + i * .1));
      ["arrow-1", "arrow-2", "arrow-3"].forEach((name, i) => enter(name, BEATS[1] + .4 + i * .1));
      ["finish-1", "finish-2", "finish-3"].forEach((name, i) => enter(name, BEATS[1] + .5 + i * .1));

      const cycle1 = BEATS[2];
      const cycle2 = BEATS[2] + (BEATS[3] - BEATS[2]) * .48;
      const cycle3 = BEATS[3];
      const cycle4 = BEATS[3] + (BEATS[4] - BEATS[3]) * .48;
      const cycle5 = BEATS[4];
      const cycle6 = BEATS[4] + (BEATS[5] - BEATS[4]) * .48;

      cycle(1, cycle1);
      moveInstruction(1, -1, 0, cycle1 + .1);

      cycle(2, cycle2);
      moveInstruction(1, 0, 1, cycle2 + .1);
      moveInstruction(2, -1, 0, cycle2 + .2);

      cycle(3, cycle3);
      moveInstruction(1, 1, 2, cycle3 + .1);
      moveInstruction(2, 0, 1, cycle3 + .2);
      moveInstruction(3, -1, 0, cycle3 + .3);

      cycle(4, cycle4);
      moveInstruction(1, 2, 3, cycle4 + .1);
      moveInstruction(2, 1, 2, cycle4 + .2);
      moveInstruction(3, 0, 1, cycle4 + .3);
      enter("complete-1", cycle4 + .9);

      cycle(5, cycle5);
      tl.to(prefix + "i1", { opacity: 0, duration: .1 }, cycle5);
      moveInstruction(2, 2, 3, cycle5 + .1);
      moveInstruction(3, 1, 2, cycle5 + .2);
      enter("complete-2", cycle5 + .8);
      tl.to(prefix + "lesson-stages", { opacity: 0, duration: .1 }, cycle5);
      tl.to(prefix + "lesson-throughput", { opacity: 1, duration: .2 }, cycle5 + .1);

      cycle(6, cycle6);
      tl.to(prefix + "i2", { opacity: 0, duration: .1 }, cycle6);
      moveInstruction(3, 2, 3, cycle6 + .1);
      enter("complete-3", cycle6 + .7);

      tl.to(prefix + "lesson-throughput", { opacity: 0, duration: .1 }, BEATS[5]);
      tl.to(prefix + "lesson-latency", { opacity: 1, duration: .2 }, BEATS[5] + .1);

      tl.to(prefix + "pipeline", { opacity: 0, duration: .2 }, BEATS[6]);
      tl.set(prefix + "hazards", { opacity: 1 }, BEATS[6] + .2);
      ["hazard-heading", "hazard-data", "hazard-branch", "hazard-resource", "hazard-note"].forEach((name, i) => enter(name, BEATS[6] + .2 + i * .1));

      tl.to(prefix + "hazards", { opacity: 0, duration: .2 }, BEATS[7]);
      tl.set(prefix + "table", { opacity: 1 }, BEATS[7] + .2);
      ["table-heading", "comparison", "table-note"].forEach((name, i) => enter(name, BEATS[7] + .2 + i * .1));

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;
    })();
  </script>
