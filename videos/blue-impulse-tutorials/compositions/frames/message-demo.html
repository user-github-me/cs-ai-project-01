  <script>
    (() => {
      const BEATS = [0.3,7,14,21,28,35,42,49];
      const CAPTIONS = [];
      const DURATION = 60;
      const tl = gsap.timeline({ paused: true });

      // The builder injects scene-relative { start, end, text } caption chunks.
      // Use an exact start only for a matching prefix. An interior result clause
      // waits for the caption end; no word-timing estimate is used.
      function clauseTime(phrase, fallback) {
        const clean = text => String(text).toLowerCase().replace(/\s+/g, ' ').trim();
        const needle = clean(phrase);
        const caption = CAPTIONS.find(item => clean(item.text).includes(needle));
        if (!caption) return fallback;
        const at = Number(clean(caption.text).startsWith(needle) ? caption.start : caption.end);
        return Number.isFinite(at) ? at : fallback;
      }

      // Entering objects pull down 12 px over three frames, then travel up.
      // All starting values live on the timeline so direct seeks are stable.
      function enter(selector, at) {
        tl.set(selector, { opacity: 0, y: 12 }, 0);
        tl.to(selector, { opacity: 1, y: 24, duration: 0.1, ease: 'power2.out' }, at);
        tl.to(selector, { y: 0, duration: 0.5, ease: 'power3.out' }, at + 0.1);
      }

      enter('#message-demo-title', BEATS[0]);
      enter('#message-demo-subtitle', BEATS[0] + 0.1);
      enter('#message-demo-intro', BEATS[0] + 0.2);
      tl.set('#message-demo-intro', { opacity: 0 }, BEATS[1]);

      enter('#message-demo-receiver-title', BEATS[1]);
      enter('#message-demo-device', BEATS[1] + 0.1);
      enter('#message-demo-units', BEATS[1] + 0.2);
      enter('#message-demo-policy', BEATS[1] + 0.3);
      enter('#message-demo-age-rule', BEATS[2]);
      enter('#message-demo-sequence-rule', BEATS[2] + 0.1);
      enter('#message-demo-processed', BEATS[2] + 0.2);

      const resultTimes = [
        clauseTime('It passes these checks', BEATS[3] + 5.5),
        clauseTime('The receiver rejects it as stale', BEATS[4] + 4.5),
        clauseTime('rejects it as a duplicate', BEATS[5] + 4.2)
      ];
      // Show only the current incoming fields, but keep the explicitly labelled
      // previous decision until the next spoken result has actually arrived.
      for (let packet = 1; packet <= 3; packet += 1) {
        const cue = packet + 2;
        if (packet > 1) {
          const previous = packet - 1;
          ['packet-title', 'device', 'units', 'policy', 'sequence', 'age'].forEach(field => {
            tl.set('#message-demo-' + field + '-' + previous, { opacity: 0 }, BEATS[cue]);
          });
          tl.set('#message-demo-result-' + previous, { opacity: 0 }, resultTimes[packet - 1]);
        }
        enter('#message-demo-packet-' + packet, BEATS[cue] + 0.1);
        enter('#message-demo-result-' + packet, resultTimes[packet - 1]);
      }

      // The 50 ms age is in a later caption than the first packet's context.
      enter('#message-demo-age-1', clauseTime('and an age of fifty milliseconds', BEATS[3] + 3.2));

      // The supporting Python starts with 41 and then remembers accepted 42.
      // Neither stale sequence 43 nor the repeat of 42 changes that state.
      tl.set('#message-demo-processed-41', { opacity: 1 }, 0);
      tl.set('#message-demo-processed-42', { opacity: 0 }, 0);
      tl.set('#message-demo-processed-41', { opacity: 0 }, resultTimes[0] + 0.1);
      tl.set('#message-demo-processed-42', { opacity: 1 }, resultTimes[0] + 0.1);

      // The security limits arrive with their narration, after all three cases.
      tl.set('#message-demo-receiver', { opacity: 1 }, 0);
      tl.set('#message-demo-receiver', { opacity: 0 }, BEATS[6]);
      [1, 2, 3].forEach(packet => tl.set('#message-demo-packet-' + packet, { opacity: 0 }, BEATS[6]));
      enter('#message-demo-assumptions', BEATS[6] + 0.1);
      tl.set('#message-demo-assumptions', { opacity: 0 }, BEATS[7]);
      enter('#message-demo-lesson', BEATS[7] + 0.1);

      tl.set('#message-demo-citation', { opacity: 1 }, DURATION - 0.001);
      window.__timelines['message-demo'] = tl;
    })();
  </script>
